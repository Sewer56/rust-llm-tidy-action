name: Test rust-llm-tidy Action

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "action.yml"
      - "scripts/**"
      - ".github/workflows/test-action.yml"
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "scripts/**"
      - ".github/workflows/test-action.yml"

jobs:
  test-prebuilt-mode:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Create standalone git repo fixture with untidy baseline
        shell: bash
        run: |
          mkdir -p fixture/src
          cat > fixture/src/main.rs <<'EOF'
          fn b() { a(); }
          fn a() {}

          pub fn hello() {}
          EOF
          git init -q fixture
          git -C fixture config user.email ci@test
          git -C fixture config user.name ci
          git -C fixture add -A
          git -C fixture commit -qm "untidy baseline"

      - name: Run action (prebuilt, apply)
        id: tidy
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            src/main.rs
          include: "reorder"
          no-config: "true"
          sevenzip-source: "fetch"   # force standalone 7-Zip download path
          release-repo: Sewer56/rust-llm-tidy
          release-tag: 0.1.0

      - name: Assert applied + reordered
        shell: bash
        run: |
          test "${{ steps.tidy.outputs.binary-path }}" != ""
          test -n "${{ steps.tidy.outputs.sevenzip-binary }}"
          grep -q "fn a()" fixture/src/main.rs
          # reorder places caller b() before callee a()
          a=$(grep -n "fn a()" fixture/src/main.rs | cut -d: -f1)
          b=$(grep -n "fn b()" fixture/src/main.rs | cut -d: -f1)
          test "$b" -lt "$a"

      - name: Commit applied result
        shell: bash
        run: |
          git -C fixture add -A
          git -C fixture commit -qm "applied tidy"

      - name: Run action again (prebuilt, check mode must pass)
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            src/main.rs
          include: "reorder"
          no-config: "true"
          mode: "check"
          release-repo: Sewer56/rust-llm-tidy
          release-tag: 0.1.0

      - name: Reintroduce untidy edit
        shell: bash
        run: printf 'fn b() { a(); }\nfn a() {}\n' > fixture/src/main.rs

      - name: Check mode must fail on untidy
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            src/main.rs
          include: "reorder"
          no-config: "true"
          mode: "check"
          release-repo: Sewer56/rust-llm-tidy
          release-tag: 0.1.0

      - name: Assert recheck failed on untidy
        shell: bash
        run: test "${{ steps.dirty.outcome }}" = "failure"

  test-git-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Run action (git mode, build from source checkout)
        id: tidy
        uses: ./
        with:
          binary-source: "git"
          use-source-checkout: "true"
          source-repo: "Sewer56/rust-llm-tidy"
          source-repo-ref: "main"
          rust-project-path: ${{ github.workspace }}
          include: "reorder"
          no-config: "true"
          dry-run: "true"

      - name: Assert built binary works
        shell: bash
        run: |
          BIN="${{ steps.tidy.outputs.binary-path }}"
          test -n "$BIN"
          test -x "$BIN"
          "$BIN" --help | grep -q "dry-run"

  test-check-mode-fails-on-dirty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Create clean baseline repo, then untidy edit
        shell: bash
        run: |
          mkdir -p fixture
          # committed baseline = tidy
          printf 'fn main() { init(); }\nfn init() {}\n' > fixture/lib.rs
          git init -q fixture
          git -C fixture config user.email ci@test
          git -C fixture config user.name ci
          git -C fixture add lib.rs
          git -C fixture commit -qm baseline
          # working-tree edit = untidy (caller before callee is wrong order)
          printf 'fn b() { a(); }\nfn a() {}\n' > fixture/lib.rs

      - name: Run action in check mode (must fail on dirty tree)
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            lib.rs
          include: "reorder"
          no-config: "true"
          mode: "check"

      - name: Assert check mode failed
        shell: bash
        run: test "${{ steps.dirty.outcome }}" = "failure"

      - name: Apply mode declares tree tidy and check passes after
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            lib.rs
          include: "reorder"
          no-config: "true"
          mode: "apply"

      - name: Commit applied result
        shell: bash
        run: |
          git -C fixture add -A
          git -C fixture commit -qm "applied tidy"

      - name: Re-run check mode after apply (must pass)
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            lib.rs
          include: "reorder"
          no-config: "true"
          mode: "check"

  test-skipping-prebuilt-7z-install-apt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Create fixture
        shell: bash
        run: |
          mkdir -p fixture
          printf 'fn b() { a(); }\nfn a() {}\n' > fixture/lib.rs

      - name: Install p7zip
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full

      - name: Run action (prebuilt, apt 7z)
        id: tidy
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            lib.rs
          include: "reorder"
          no-config: "true"
          sevenzip-source: "apt"
          release-repo: Sewer56/rust-llm-tidy
          release-tag: 0.1.0

      - name: Assert apply worked
        shell: bash
        run: |
          a=$(grep -n "fn a()" fixture/lib.rs | cut -d: -f1)
          b=$(grep -n "fn b()" fixture/lib.rs | cut -d: -f1)
          test "$b" -lt "$a"
