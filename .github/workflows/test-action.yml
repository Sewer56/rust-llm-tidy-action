name: Test rust-llm-tidy Action

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "action.yml"
      - "scripts/**"
      - ".github/actions/**"
      - ".github/workflows/test-action.yml"
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "scripts/**"
      - ".github/actions/**"
      - ".github/workflows/test-action.yml"

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Run script unit tests
        run: python3 -m unittest discover -s scripts/tests -v

  test-prebuilt-mode:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Keep fixture reporting off this repository's PRs
        uses: ./.github/actions/fixture-gh-stub

      - name: Create standalone git repo fixture with untidy baseline
        shell: bash
        run: |
          mkdir -p fixture/src
          cat > fixture/src/main.rs <<'EOF'
          fn b() { a(); }
          fn a() {}

          pub fn hello() {}
          EOF
          git init -q fixture
          git -C fixture config user.email ci@test
          git -C fixture config user.name ci
          git -C fixture add -A
          git -C fixture commit -qm "untidy baseline"
          # Bare remote: apply mode pushes its fixes on pull_request events.
          git init -q --bare "$RUNNER_TEMP/fixture-origin"
          git -C fixture remote add origin "$RUNNER_TEMP/fixture-origin"

      - name: Run action (prebuilt, apply)
        id: tidy
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            src/main.rs
          include: "reorder"
          no-config: "true"
          sevenzip-source: "fetch"   # force standalone 7-Zip download path
          release-repo: Sewer56/rust-llm-tidy
          release-tag: 0.5.0

      - name: Assert applied + reordered
        shell: bash
        run: |
          test "${{ steps.tidy.outputs.binary-path }}" != ""
          test -n "${{ steps.tidy.outputs.sevenzip-binary }}"
          grep -q "fn a()" fixture/src/main.rs
          # reorder places caller b() before callee a()
          a=$(grep -n "fn a()" fixture/src/main.rs | cut -d: -f1)
          b=$(grep -n "fn b()" fixture/src/main.rs | cut -d: -f1)
          test "$b" -lt "$a"

      - name: Commit applied result
        shell: bash
        run: |
          git -C fixture add -A
          # PR events: the action already committed; push events: commit here.
          git -C fixture commit -qm "applied tidy" || true

      - name: Run action again (prebuilt, check mode must pass)
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            src/main.rs
          include: "reorder"
          no-config: "true"
          mode: "check"
          release-repo: Sewer56/rust-llm-tidy
          release-tag: 0.5.0

      - name: Reintroduce untidy edit
        shell: bash
        run: printf 'fn b() { a(); }\nfn a() {}\n' > fixture/src/main.rs

      - name: Check mode must fail on untidy
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            src/main.rs
          include: "reorder"
          no-config: "true"
          mode: "check"
          release-repo: Sewer56/rust-llm-tidy
          release-tag: 0.5.0

      - name: Assert recheck failed on untidy
        shell: bash
        run: test "${{ steps.dirty.outcome }}" = "failure"

  test-git-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Keep fixture reporting off this repository's PRs
        uses: ./.github/actions/fixture-gh-stub

      - name: Run action (git mode, build from source checkout)
        id: tidy
        uses: ./
        with:
          binary-source: "git"
          use-source-checkout: "true"
          source-repo: "Sewer56/rust-llm-tidy"
          source-repo-ref: "main"
          rust-project-path: ${{ github.workspace }}
          include: "reorder"
          no-config: "true"
          dry-run: "true"

      - name: Assert built binary works
        shell: bash
        run: |
          BIN="${{ steps.tidy.outputs.binary-path }}"
          test -n "$BIN"
          test -x "$BIN"
          "$BIN" --help | grep -q "dry-run"

      - name: Assert source checkout and no target/ cleaned up from workspace
        shell: bash
        run: |
          test ! -d "${{ github.workspace }}/.rlt-source"
          test ! -d "${{ github.workspace }}/target"

  test-check-mode-fails-on-dirty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Keep fixture reporting off this repository's PRs
        uses: ./.github/actions/fixture-gh-stub

      - name: Create clean baseline repo, then untidy edit
        shell: bash
        run: |
          mkdir -p fixture
          # committed baseline = tidy
          printf 'fn main() { init(); }\nfn init() {}\n' > fixture/lib.rs
          git init -q fixture
          git -C fixture config user.email ci@test
          git -C fixture config user.name ci
          git -C fixture add lib.rs
          git -C fixture commit -qm baseline
          # working-tree edit = untidy (caller before callee is wrong order)
          printf 'fn b() { a(); }\nfn a() {}\n' > fixture/lib.rs
          # Bare remote: apply mode pushes its fixes on pull_request events.
          git init -q --bare "$RUNNER_TEMP/fixture-origin"
          git -C fixture remote add origin "$RUNNER_TEMP/fixture-origin"

      - name: Run action in check mode (must fail on dirty tree)
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            lib.rs
          include: "reorder"
          no-config: "true"
          mode: "check"

      - name: Assert check mode failed
        shell: bash
        run: test "${{ steps.dirty.outcome }}" = "failure"

      - name: Apply mode declares tree tidy and check passes after
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            lib.rs
          include: "reorder"
          no-config: "true"
          mode: "apply"

      - name: Commit applied result
        shell: bash
        run: |
          git -C fixture add -A
          # PR events: the action already committed; push events: commit here.
          git -C fixture commit -qm "applied tidy" || true

      - name: Re-run check mode after apply (must pass)
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            lib.rs
          include: "reorder"
          no-config: "true"
          mode: "check"

  test-changed-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Keep fixture reporting off this repository's PRs
        uses: ./.github/actions/fixture-gh-stub

      - name: Create clean baseline repo, then untidy edit (only this file changed)
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p fixture
          git init -q fixture
          # PR events: branch the fixture from the PR base sha so the
          # changed-files diff resolves. Push events: no base; the CLI
          # falls back to the working-tree diff.
          if [ -n "$PR_BASE" ]; then
            # Fetch from origin, not this (shallow) checkout: git refuses
            # to update shallow roots through a local fetch.
            url="$(git -C "$GITHUB_WORKSPACE" remote get-url origin)"
            git -C fixture fetch -q "$url" "$PR_BASE"
            git -C fixture checkout -q FETCH_HEAD
          fi
          git -C fixture config user.email ci@test
          git -C fixture config user.name ci
          # committed baseline = tidy for two files; then untidy ONE
          printf 'fn main() { init(); }\nfn init() {}\n' > fixture/lib.rs
          printf 'fn other() {}\n' > fixture/other.rs
          git -C fixture add -A
          git -C fixture commit -qm baseline
          # untidy working-tree edit (caller before callee is wrong order)
          printf 'fn b() { a(); }\nfn a() {}\n' > fixture/lib.rs

      - name: Run action (changed-files, must tidy only lib.rs and fail check)
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          rust-project-path: fixture
          changed-files: "true"
          include: "reorder"
          no-config: "true"
          mode: "check"

      - name: Assert check failed (untidy changed file detected)
        shell: bash
        run: test "${{ steps.dirty.outcome }}" = "failure"

      - name: Assert only the changed file was processed (other.rs untouched)
        shell: bash
        run: |
          grep -q "fn other() {}" fixture/other.rs
          grep -q "fn a() {}" fixture/lib.rs

  test-apply-push-comment:
    runs-on: ubuntu-latest
    # Exercises the apply/check post-processing logic (commit + push + PR
    # comment + fail) which needs a PR event context a normal job does not
    # have. Runs the action's real "Run rust-llm-tidy" script (extracted from
    # action.yml) against a real local git remote, with a stub `gh`.
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Set up stub gh and tidy tool
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          # gh stub: `gh pr comment` prints the comment body; `gh api`
          # answers the findings-report REST surfaces offline. The PR
          # head mirrors the remote branch (what the run pushed or the
          # step set up), falling back to RLT_HEAD_SHA and then HEAD.
          cat > "$RUNNER_TEMP/bin/gh" <<'SH'
          #!/usr/bin/env bash
          if [ "$1" = "api" ]; then
            printf '%s\n' "$*" >> "$RUNNER_TEMP/gh-api.log"
            head="$(git rev-parse --verify origin/feature 2>/dev/null \
                    || printf '%s' "${RLT_HEAD_SHA:-$(git rev-parse HEAD)}")"
            case "$*" in
              *"--method GET user"*) printf '{"login":"ci-bot"}\n' ;;
              *"pulls/7"*) printf '{"number":7,"head":{"sha":"%s"}}\n' "$head" ;;
              *"--method POST"*|*"--method PATCH"*)
                cat > "$RUNNER_TEMP/gh-api-body.json"
                printf '{"id":42,"html_url":"https://github.test/o/r/issues/7#issuecomment-42"}\n'
                ;;
              *) printf '[]\n' ;;
            esac
            exit 0
          fi
          f="$(echo "$@" | sed -n 's/.*--body-file \([^ ]*\).*/\1/p')"
          echo "===== GH COMMENT ====="
          cat "$f"
          echo "===== END ====="
          SH
          # The "tidy" tool: rewrites lib.rs to the tidy form (reorder) and
          # emits a lint finding on stdout as a JSON array, exactly like the
          # real CLI's `--output-mode json`. RLT_STUB_RC simulates the real
          # CLI exiting non-zero when lints remain.
          cat > "$RUNNER_TEMP/bin/tidy" <<'SH'
          #!/usr/bin/env bash
          printf 'fn main() { init(); }\nfn init() {}\n' > lib.rs
          printf '%s\n' '[{"path":"lib.rs","line":1,"severity":"error","code":"DOC001","message":"non-private item | note missing a doc comment","item_kind":"fn","item_name":"hello"}]'
          exit "${RLT_STUB_RC:-0}"
          SH
          # The dry-run stub: reports the changes a transformation would make
          # (a `severity:"success"` reorder record, with a pipe in the message
          # to prove it stays escaped in the comment) and does NOT edit files.
          cat > "$RUNNER_TEMP/bin/tidy-dry-run" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' '[{"path":"lib.rs","line":1,"severity":"success","code":"REORDER","message":"rearrange fn a_main | from pos 2 to pos 1 (before b_helper)","item_kind":"fn","item_name":"a_main","from":2,"to":1,"before_name":"b_helper"}]'
          exit "${RLT_STUB_RC:-0}"
          SH
          # The clean stub: writes the tidy content (no diff) and emits an empty
          # JSON doc, so an already-tidy PR exits clean without commenting.
          cat > "$RUNNER_TEMP/bin/tidy-clean" <<'SH'
          #!/usr/bin/env bash
          printf 'fn main() { init(); }\nfn init() {}\n' > lib.rs
          printf '%s\n' '[]'
          exit "${RLT_STUB_RC:-0}"
          SH
          # The doc-gap stub: emits only an error-severity lint row (no success
          # change record) and does NOT edit the tree, exercising the empty-files
          # lint-only failing dry-run branch of the run script. The row carries
          # a `title` distinct from the TITLES map entry for DOC001, so the
          # report grep proves the renderer prefers the record's own title.
          cat > "$RUNNER_TEMP/bin/tidy-docgap" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' '[{"path":"lib.rs","line":1,"severity":"error","code":"DOC001","message":"missing doc comment for `hello`","item_kind":"fn","item_name":"hello","title":"record-sourced title"}]'
          exit "${RLT_STUB_RC:-1}"
          SH
          # The fallback stub: one mapped error plus one warning with an
          # unmapped lint code (a code from a newer released binary), to pin
          # the unknown-code title fallback and mixed counts; does NOT edit
          # files, exercising the lint-only failing branch. The mapped error
          # carries an empty `title`, pinning the fall-through to the map
          # (the bullet never renders an empty title).
          cat > "$RUNNER_TEMP/bin/tidy-fallback" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' '[{"path":"lib.rs","line":1,"severity":"error","code":"DOC001","message":"non-private item is missing a doc comment","item_kind":"fn","item_name":"hello","title":""},{"path":"lib.rs","line":2,"severity":"warning","code":"DOC009","message":"future lint says fix it","item_kind":"fn","item_name":null}]'
          exit "${RLT_STUB_RC:-1}"
          SH
          chmod +x "$RUNNER_TEMP/bin/gh" "$RUNNER_TEMP/bin/tidy" "$RUNNER_TEMP/bin/tidy-dry-run" "$RUNNER_TEMP/bin/tidy-clean" "$RUNNER_TEMP/bin/tidy-docgap" "$RUNNER_TEMP/bin/tidy-fallback"

      - name: Extract run script + create fixture repo
        shell: bash
        run: |
          # Build the github.action_path needle from parts: written
          # literally, this workflow's evaluator would substitute it (empty)
          # before bash runs. Resolved to this checkout (PWD).
          python3 - <<'PY'
          import os
          import yaml
          d = yaml.safe_load(open('action.yml'))
          src = next(s['run'] for s in d['runs']['steps'] if s.get('id') == 'tidy')
          needle = "$" + "{{ github.action_path }}"
          text = "\n".join(
              line[8:] if line.startswith(" " * 8) else line
              for line in src.split("\n")
          )
          text = text.replace(needle, os.getcwd())
          path = os.path.join(os.environ["RUNNER_TEMP"], "run_dedent.sh")
          open(path, "w").write(text)
          PY

          git init -q --bare "$RUNNER_TEMP/origin"
          git init -q "$RUNNER_TEMP/repo"
          git -C "$RUNNER_TEMP/repo" config user.email ci@test
          git -C "$RUNNER_TEMP/repo" config user.name ci
          git -C "$RUNNER_TEMP/repo" remote add origin "$RUNNER_TEMP/origin"
          # Tidy baseline commit; every step resets here so its untidy edit
          # always differs from HEAD (git commit always succeeds).
          printf 'fn main() { init(); }\nfn init() {}\n' > "$RUNNER_TEMP/repo/lib.rs"
          git -C "$RUNNER_TEMP/repo" add -A
          git -C "$RUNNER_TEMP/repo" commit -qm tidy-base
          git -C "$RUNNER_TEMP/repo" tag tidy-base

      - name: apply + PR, push succeeds (expect commit + exit 0)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/repo"
          printf 'fn b() { a(); }\nfn a() {}\n' > lib.rs
          git add -A; git commit -qm untidy
          git push -q origin HEAD:refs/heads/feature

          rm -f "$RUNNER_TEMP/rlt-comment.md" "$RUNNER_TEMP/gh-api.log" \
                "$RUNNER_TEMP/gh-api-body.json"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          # The pre-push PR head, as the real action always exports it.
          export RLT_HEAD_SHA="$(git rev-parse HEAD)"
          export MODE=apply IS_PR=true PR_NUMBER=7 HEAD_REF=feature
          export COMMIT_NAME=bot COMMIT_EMAIL=b@b GITHUB_TOKEN=x RLT_BIN="$RUNNER_TEMP/bin/tidy"
          bash "$RUNNER_TEMP/run_dedent.sh"
          rc=$?
          echo "exit=$rc (expect 0)"
          test "$rc" = 0
          test ! -f "$RUNNER_TEMP/rlt-comment.md"   # success: no comment
          git fetch -q origin && git -C . rev-parse --verify origin/feature >/dev/null
          # The findings report publishes once, at the pushed revision
          # (never the stale pre-push head in RLT_HEAD_SHA).
          posts="$(grep -c -- '--method POST' "$RUNNER_TEMP/gh-api.log" || true)"
          test "$posts" = 1
          grep -Fq "blob/$(git rev-parse HEAD)/lib.rs#L1" "$RUNNER_TEMP/gh-api-body.json"
          ! grep -Fq "blob/$RLT_HEAD_SHA/lib.rs" "$RUNNER_TEMP/gh-api-body.json"

      - name: apply + PR, push fails (expect failure comment + exit 1)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/repo"
          printf 'fn b() { a(); }\nfn a() {}\n' > lib.rs
          git add -A; git commit -qm untidy2
          # stub git: reject the push. Resolve real git so the stub can exec it.
          REAL_GIT="$(readlink -f "$(command -v git)")"
          cat > "$RUNNER_TEMP/bin/git" <<SH
          #!/usr/bin/env bash
          if [ "\$1" = "push" ] && [ "\$RLT_PUSH_FAIL" = "1" ]; then
            echo "error: RPC failed" >&2; exit 1
          fi
          exec $REAL_GIT "\$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/git"

          # The PR head this run reports on: untidy2, pushed so the
          # remote (and the stub's PR head) match it; the run's own push
          # below then fails. The head view needs the run's argv file
          # (normally written by the args step).
          git push -q origin HEAD:refs/heads/feature
          export RLT_HEAD_SHA="$(git rev-parse HEAD)"
          printf '%s\0' --output-mode json . > "$RUNNER_TEMP/rlt-args"
          rm -f "$RUNNER_TEMP/gh-api.log" "$RUNNER_TEMP/gh-api-body.json"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export MODE=apply IS_PR=true PR_NUMBER=7 HEAD_REF=feature
          export COMMIT_NAME=bot COMMIT_EMAIL=b@b GITHUB_TOKEN=x
          export RLT_BIN="$RUNNER_TEMP/bin/tidy" RLT_PUSH_FAIL=1
          bash "$RUNNER_TEMP/run_dedent.sh" && { echo "should have failed"; exit 1; } || true
          grep -q "could not push fixes" "$RUNNER_TEMP/rlt-comment.md"
          grep -q '`lib.rs`' "$RUNNER_TEMP/rlt-comment.md"
          # The report describes the PR head, not the local fix commit.
          posts="$(grep -c -- '--method POST' "$RUNNER_TEMP/gh-api.log" || true)"
          test "$posts" = 1
          grep -Fq "blob/$RLT_HEAD_SHA/lib.rs#L1" "$RUNNER_TEMP/gh-api-body.json"
          unset RLT_PUSH_FAIL

      - name: check + dirty PR (expect fail comment with findings + exit 1, no commit)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/repo"
          git reset -q --hard tidy-base && git clean -qfd
          printf 'fn b() { a(); }\nfn a() {}\n' > lib.rs
          git add -A; git commit -qm untidy3

          export PATH="$RUNNER_TEMP/bin:$PATH"
          export MODE=check IS_PR=true PR_NUMBER=7 HEAD_REF=feature
          export COMMIT_NAME=bot COMMIT_EMAIL=b@b GITHUB_TOKEN=x RLT_BIN="$RUNNER_TEMP/bin/tidy"
          export RLT_STUB_RC=1
          # The PR head this run reports on: untidy3, pushed (force: the
          # fixture history diverged) so the remote matches it. The head
          # view needs the run's argv file (normally written by the args
          # step).
          git push -q -f origin HEAD:refs/heads/feature
          export RLT_HEAD_SHA="$(git rev-parse HEAD)"
          printf '%s\0' --output-mode json . > "$RUNNER_TEMP/rlt-args"
          rm -f "$RUNNER_TEMP/gh-api.log" "$RUNNER_TEMP/gh-api-body.json"
          bash "$RUNNER_TEMP/run_dedent.sh" && { echo "should have failed"; exit 1; } || true
          grep -q "not tidy" "$RUNNER_TEMP/rlt-comment.md"
          # findings render as severity-grouped bullets from the JSON document
          grep -q '^1 error\.$' "$RUNNER_TEMP/rlt-comment.md"
          grep -q '^### Errors$' "$RUNNER_TEMP/rlt-comment.md"
          grep -q '\*\*`DOC001` missing documentation\*\* - `lib.rs:1`' "$RUNNER_TEMP/rlt-comment.md"
          # pipe in a finding bullet renders raw (bullets cannot split cells)
          grep -q 'non-private item | note missing a doc comment' "$RUNNER_TEMP/rlt-comment.md"
          # check mode must NOT commit
          test "$(git rev-parse HEAD)" = "$(git rev-parse HEAD~0)"
          # The report describes the committed PR head, not the fixes left
          # uncommitted in the tree.
          posts="$(grep -c -- '--method POST' "$RUNNER_TEMP/gh-api.log" || true)"
          test "$posts" = 1
          grep -Fq "blob/$RLT_HEAD_SHA/lib.rs#L1" "$RUNNER_TEMP/gh-api-body.json"

      - name: apply non-PR (expect mutate + leave changes, exit 0, no comment)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/repo"
          git reset -q --hard tidy-base && git clean -qfd
          printf 'fn b() { a(); }\nfn a() {}\n' > lib.rs
          git add -A; git commit -qm untidy4

          rm -f "$RUNNER_TEMP/rlt-comment.md"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export MODE=apply IS_PR=false PR_NUMBER=7 HEAD_REF=feature
          export COMMIT_NAME=bot COMMIT_EMAIL=b@b GITHUB_TOKEN=x RLT_BIN="$RUNNER_TEMP/bin/tidy"
          bash "$RUNNER_TEMP/run_dedent.sh"
          echo "exit=$? (expect 0)"
          grep -q "fn init()" lib.rs      # mutated
          test ! -f "$RUNNER_TEMP/rlt-comment.md"   # no comment written

      - name: already tidy (expect exit 0, no comment)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/repo"
          git reset -q --hard tidy-base && git clean -qfd   # tree already tidy
          # Keep the remote PR head at this revision (force: diverged).
          git push -q -f origin HEAD:refs/heads/feature

          rm -f "$RUNNER_TEMP/rlt-comment.md" "$RUNNER_TEMP/gh-api.log" \
                "$RUNNER_TEMP/gh-api-body.json"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export MODE=apply IS_PR=true PR_NUMBER=7 HEAD_REF=feature
          export COMMIT_NAME=bot COMMIT_EMAIL=b@b GITHUB_TOKEN=x RLT_BIN="$RUNNER_TEMP/bin/tidy-clean"
          bash "$RUNNER_TEMP/run_dedent.sh"
          echo "exit=$? (expect 0)"
          test ! -f "$RUNNER_TEMP/rlt-comment.md"   # success: no comment
          # No findings and no prior report: nothing is published.
          if [ -f "$RUNNER_TEMP/gh-api.log" ]; then
            ! grep -q -- '--method POST' "$RUNNER_TEMP/gh-api.log"
          fi

      - name: dry-run failure reports changes in a Changes block (expect report + exit 1)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/repo"
          # tidy tree: dry-run records would-be changes without editing, and
          # the stub rc (1) marks lints remaining so the run fails + comments.
          git reset -q --hard tidy-base && git clean -qfd
          rm -f "$RUNNER_TEMP/rlt-comment.md"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export MODE=check IS_PR=true PR_NUMBER=7 HEAD_REF=feature
          export COMMIT_NAME=bot COMMIT_EMAIL=b@b GITHUB_TOKEN=x RLT_BIN="$RUNNER_TEMP/bin/tidy-dry-run"
          export RLT_STUB_RC=1
          bash "$RUNNER_TEMP/run_dedent.sh" && { echo "should have failed"; exit 1; } || true
          grep -q 'not tidy' "$RUNNER_TEMP/rlt-comment.md"
          # change record rendered into a Changes block, pipe escaped
          grep -q '^### Changes' "$RUNNER_TEMP/rlt-comment.md"
          grep -q 'REORDER' "$RUNNER_TEMP/rlt-comment.md"
          grep -q 'rearrange fn a_main &#124; from pos 2 to pos 1' "$RUNNER_TEMP/rlt-comment.md"
          unset RLT_STUB_RC

      - name: args builder requests JSON for dry-run too
        shell: bash
        run: |
          # Substitute the inputs.* templates (dry-run = true), building the
          # needles from parts so this workflow's evaluator does not
          # substitute them first. Remaining inputs: RLT_* env vars below.
          python3 - <<'PY'
          import os
          import yaml
          d = yaml.safe_load(open('action.yml'))
          src = next(s['run'] for s in d['runs']['steps'] if s.get('id') == 'args')
          text = "\n".join(
              line[8:] if line.startswith(" " * 8) else line
              for line in src.split("\n")
          )
          for key, value in (
              ("inputs.validate", "false"),
              ("inputs.no-config", "false"),
              ("inputs.dry-run", "true"),
          ):
              text = text.replace("$" + "{{ " + key + " }}", value)
          path = os.path.join(os.environ["RUNNER_TEMP"], "args_dedent.sh")
          open(path, "w").write(text)
          PY
          cd "$RUNNER_TEMP/repo"
          RLT_CONFIG_PATH= RLT_INCLUDE= RLT_EXCLUDE= \
          RLT_PATH_LIST= RLT_DEFAULT_FILES= RLT_CHANGED_FILES= \
          bash "$RUNNER_TEMP/args_dedent.sh"
          args=(); while IFS= read -r -d '' a; do args+=("$a"); done < "$RUNNER_TEMP/rlt-args"
          # Exact argv: JSON output, dry-run, whole-project path.
          expected=(--output-mode json --dry-run .)
          test "${#args[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${args[$i]}" = "${expected[$i]}"
          done

      - name: check + PR, lint-only failing dry-run (expect report + exit 1)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/repo"
          git reset -q --hard tidy-base && git clean -qfd
          rm -f "$RUNNER_TEMP/rlt-comment.md"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export MODE=check IS_PR=true PR_NUMBER=7 HEAD_REF=feature
          export COMMIT_NAME=bot COMMIT_EMAIL=b@b GITHUB_TOKEN=x
          export RLT_BIN="$RUNNER_TEMP/bin/tidy-docgap" RLT_STUB_RC=1
          bash "$RUNNER_TEMP/run_dedent.sh" && { echo "should have failed"; exit 1; } || true
          grep -q 'not tidy' "$RUNNER_TEMP/rlt-comment.md"
          grep -q '^### Errors$' "$RUNNER_TEMP/rlt-comment.md"
          # the record's own title renders, not the TITLES map entry for DOC001
          grep -q '\*\*`DOC001` record-sourced title\*\*' "$RUNNER_TEMP/rlt-comment.md"
          grep -q 'DOC001' "$RUNNER_TEMP/rlt-comment.md"

      - name: comment locations pin the blob SHA when RLT_BLOB_BASE is set (expect report + exit 1)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/repo"
          git reset -q --hard tidy-base && git clean -qfd
          rm -f "$RUNNER_TEMP/rlt-comment.md"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export MODE=check IS_PR=true PR_NUMBER=7 HEAD_REF=feature
          export COMMIT_NAME=bot COMMIT_EMAIL=b@b GITHUB_TOKEN=x
          export RLT_BIN="$RUNNER_TEMP/bin/tidy-fallback" RLT_STUB_RC=1
          export RLT_BLOB_BASE="https://github.com/o/r/blob/stubsha/"
          bash "$RUNNER_TEMP/run_dedent.sh" && { echo "should have failed"; exit 1; } || true
          # linked mode: locations render as SHA-pinned blob links
          grep -Fq '[lib.rs:1](<https://github.com/o/r/blob/stubsha/lib.rs#L1>)' "$RUNNER_TEMP/rlt-comment.md"
          grep -Fq '[lib.rs:2](<https://github.com/o/r/blob/stubsha/lib.rs#L2>)' "$RUNNER_TEMP/rlt-comment.md"
          # unmapped lint code falls back to the raw code as title
          grep -q '\*\*`DOC009` DOC009\*\*' "$RUNNER_TEMP/rlt-comment.md"
          # empty `title` falls through to the map entry (never renders empty)
          grep -q '\*\*`DOC001` missing documentation\*\*' "$RUNNER_TEMP/rlt-comment.md"
          grep -q '^1 error, 1 warning\.$' "$RUNNER_TEMP/rlt-comment.md"
          # warnings group under their own section, after Errors
          grep -q '^### Warnings$' "$RUNNER_TEMP/rlt-comment.md"

  test-skipping-prebuilt-7z-install-apt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v7

      - name: Keep fixture reporting off this repository's PRs
        uses: ./.github/actions/fixture-gh-stub

      - name: Create fixture
        shell: bash
        run: |
          mkdir -p fixture
          printf 'fn b() { a(); }\nfn a() {}\n' > fixture/lib.rs
          git init -q fixture
          git -C fixture config user.email ci@test
          git -C fixture config user.name ci
          git -C fixture add -A
          git -C fixture commit -qm untidy-baseline
          # Bare remote: apply mode pushes its fixes on pull_request events.
          git init -q --bare "$RUNNER_TEMP/fixture-origin"
          git -C fixture remote add origin "$RUNNER_TEMP/fixture-origin"

      - name: Install p7zip
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full

      - name: Run action (prebuilt, apt 7z)
        id: tidy
        uses: ./
        with:
          rust-project-path: fixture
          paths: |
            lib.rs
          include: "reorder"
          no-config: "true"
          sevenzip-source: "apt"
          release-repo: Sewer56/rust-llm-tidy
          release-tag: 0.5.0

      - name: Assert apply worked
        shell: bash
        run: |
          a=$(grep -n "fn a()" fixture/lib.rs | cut -d: -f1)
          b=$(grep -n "fn b()" fixture/lib.rs | cut -d: -f1)
          test "$b" -lt "$a"
