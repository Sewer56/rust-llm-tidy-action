name: "rust-llm-tidy"
description: "Runs rust-llm-tidy (fix, reorder, narrow visibility, lint) on Rust and Markdown files. Binary comes from prebuilt release artifacts, from source, or from PATH."
branding:
  icon: "book-open"
  color: "blue"

inputs:
  # ── Binary acquisition ─────────────────────────────────────
  binary-source:
    description: >-
      Where to get the rust-llm-tidy binary. 'prebuilt' downloads a release
      artifact, 'git' builds from a source checkout, 'none' uses a
      pre-installed `rust-llm-tidy` found on PATH.
    required: false
    default: "prebuilt"

  # Prebuilt mode
  release-repo:
    description: "GitHub repo (owner/name) hosting the prebuilt release artifacts"
    required: false
    default: "Sewer56/rust-llm-tidy"
  release-tag:
    description: "Release tag to download. Empty uses the latest release."
    required: false
    default: ""
  download-asset:
    description: >-
      Exact release asset name to download. Overrides automatic target
      detection (useful for testing).
    required: false
    default: ""
  install-dir:
    description: >-
      Directory to install the downloaded binary into. Relative paths are
      resolved against $RUNNER_TEMP.
    required: false
    default: "rust-llm-tidy-bin"
  cache-prebuilt:
    description: "Whether to cache the downloaded binary across runs"
    required: false
    default: "false"

  # 7-Zip extraction
  sevenzip-source:
    description: |-
      Where the native 7-Zip used to extract release artifacts comes from.

      Options:

        auto (default)
            Use a 7z/7zz binary already on the runner
            (includes Windows Program Files\7-Zip and
            macOS libarchive tar). If none found, download
            a standalone 7-Zip from GitHub.

        fetch
            Always download a standalone 7-Zip from GitHub
            (ip7z/7zip releases).

        version:<x.y>
            Download a specific 7-Zip version.
            Example: version:26.02

        apt
            Linux only. Require p7zip-full pre-installed
            via apt. No download.

        preinstalled
            Require 7z or 7zz binary already present on
            the runner. No download.
    required: false
    default: "auto"
  cache-sevenzip:
    description: "Whether to cache a downloaded standalone 7-Zip across runs"
    required: false
    default: "false"

  # Git-build mode
  source-path:
    description: >-
      Path to a rust-llm-tidy source checkout (manifest expected at
      <path>/Cargo.toml or, for older layouts, <path>/src/Cargo.toml).
      Defaults to the current repository checkout
      (github.workspace); in the vendored submodule layout that is the
      enclosing rust-llm-tidy repo itself, so 'git' mode builds from
      your own current source. Set explicitly for non-rust-llm-tidy repos.
    required: false
    default: "${{ github.workspace }}"
  use-source-checkout:
    description: "Whether to checkout source-repo@source-repo-ref into the workspace for building. Overrides source-path."
    required: false
    default: "false"
  source-repo:
    description: "GitHub repo (owner/name) of rust-llm-tidy source when use-source-checkout is true"
    required: false
    default: "Sewer56/rust-llm-tidy"
  source-repo-ref:
    description: "Branch, tag or SHA of source-repo to checkout. Pin to a SHA for reproducible builds."
    required: false
    default: "main"
  install-rust-toolchain:
    description: "Whether to install the Rust toolchain used to build from source"
    required: false
    default: "true"
  rust-toolchain:
    description: "Rust toolchain used to build from source"
    required: false
    default: "stable"
  setup-rust-cache:
    description: "Whether to restore/save a rust cache for the git build"
    required: false
    default: "true"

  # ── Tidy invocation ────────────────────────────────────────
  rust-project-path:
    description: "Working directory used to run rust-llm-tidy (and the git diff check)"
    required: false
    default: "${{ github.workspace }}"
  paths:
    description: >-
      Paths to tidy, one per line. Each directory is expanded recursively;
      only .rs/.md files are processed. Empty behaves per `changed-files`:
      either the PR's changed files (when true) or '.' - the whole
      rust-project-path.
    required: false
    default: ""
  changed-files:
    description: >-
      When true and `paths` is empty, tidy only the files changed by this
      PR (vs its base branch). Ignored when `paths` is set. In non-PR
      contexts falls back to the working-tree git diff.
    required: false
    default: "false"
  mode:
    description: >-
      'apply' tidies files in place; on a pull request it also commits and
      pushes the fixes to the PR branch, and if that push is impossible (fork
      PR / read-only token) it posts a PR comment listing the fixed files and
      fails. 'check' uses --dry-run and fails on proposed edits or lint errors;
      external formatters are skipped. PR runs require a clean checkout
      (validate runs exempt). When check reports proposed edits or lint
      errors, it attempts to post a PR comment.
    required: false
    default: "apply"
  config-path:
    description: "Explicit path to a .rust-llm-tidy.yml config (--config)"
    required: false
    default: ""
  no-config:
    description: "Disable config discovery entirely (--no-config)"
    required: false
    default: "false"
  include:
    description: "Comma- or space-separated ops/lint-codes to run (--include). Example: 'reorder,vis'"
    required: false
    default: ""
  exclude:
    description: "Comma- or space-separated ops/lint-codes to skip (--exclude). Example: 'lints'"
    required: false
    default: ""
  dry-run:
    description: "Print results to stdout instead of modifying files"
    required: false
    default: "false"
  validate:
    description: "Validate the config and exit; do not process files"
    required: false
    default: "false"

outputs:
  binary-path:
    description: "Path to the rust-llm-tidy binary that was used"
    value: ${{ steps.binary.outputs.path }}
  source-dir:
    description: "Resolved rust-llm-tidy source directory (git mode only)"
    value: ${{ steps.source.outputs.source_dir }}
  sevenzip-binary:
    description: "Path to the 7-Zip binary used for extraction"
    value: ${{ steps.sevenzip.outputs.sevenzip_binary || steps.sevenzip-env.outputs.sevenzip_binary }}

runs:
  using: "composite"
  steps:
    # ── Source resolution (git mode) ─────────────────────────
    - name: Checkout rust-llm-tidy source
      if: >-
        inputs.binary-source == 'git' &&
        inputs.use-source-checkout == 'true'
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.source-repo }}
        ref: ${{ inputs.source-repo-ref }}
        path: ${{ github.workspace }}/.rlt-source

    - name: Resolve source directory
      id: source
      shell: bash
      env:
        RLT_SOURCE_PATH: ${{ inputs.source-path }}
      run: |
        if [ "${{ inputs.use-source-checkout }}" = "true" ]; then
          SOURCE_DIR="${{ github.workspace }}/.rlt-source"
        else
          SOURCE_DIR="$RLT_SOURCE_PATH"
        fi
        printf 'source_dir=%s\n' "$SOURCE_DIR" >> "$GITHUB_OUTPUT"
        # rust-llm-tidy >= 1.4 keeps the workspace manifest at the repo root;
        # older layouts keep it under src/. Probe both.
        if [ -f "$SOURCE_DIR/Cargo.toml" ]; then
          printf 'manifest=%s\n' "$SOURCE_DIR/Cargo.toml" >> "$GITHUB_OUTPUT"
        elif [ -f "$SOURCE_DIR/src/Cargo.toml" ]; then
          printf 'manifest=%s\n' "$SOURCE_DIR/src/Cargo.toml" >> "$GITHUB_OUTPUT"
        else
          echo "manifest=" >> "$GITHUB_OUTPUT"
        fi

    # ── Prebuilt binary (prebuilt mode) ──────────────────────
    # Ensure a native 7-Zip CLI exists before extracting release artifacts.
    # resolve_artifact.py receives it via SEVENZIP_BINARY.
    - name: Ensure 7-Zip
      if: inputs.binary-source == 'prebuilt' && inputs.sevenzip-source != 'preinstalled'
      id: sevenzip
      shell: bash
      run: python3 "${{ github.action_path }}/scripts/ensure_7z.py"
      env:
        INPUT_SEVENZIP_SOURCE: ${{ inputs.sevenzip-source }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_TEMP: ${{ runner.temp }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Cache 7-Zip
      if: >-
        inputs.binary-source == 'prebuilt' &&
        inputs.cache-sevenzip == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/sevenzip-bin
        key: sevenzip-bin-${{ inputs.sevenzip-source }}

    - name: Cache 7-Zip source archive
      if: >-
        inputs.binary-source == 'prebuilt' &&
        inputs.cache-sevenzip == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/sevenzip-bin-src
        key: sevenzip-src-${{ inputs.sevenzip-source }}

    - name: Detect environment 7-Zip
      if: >-
        inputs.binary-source == 'prebuilt' &&
        inputs.sevenzip-source == 'preinstalled'
      id: sevenzip-env
      shell: bash
      run: python3 "${{ github.action_path }}/scripts/ensure_7z.py"
      env:
        INPUT_SEVENZIP_SOURCE: ${{ inputs.sevenzip-source }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_TEMP: ${{ runner.temp }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Install rust-llm-tidy from release artifact
      if: inputs.binary-source == 'prebuilt'
      id: prebuilt
      shell: bash
      run: python3 "${{ github.action_path }}/scripts/resolve_artifact.py"
      env:
        INPUT_RELEASE_REPO: ${{ inputs.release-repo }}
        INPUT_RELEASE_TAG: ${{ inputs.release-tag }}
        INPUT_DOWNLOAD_ASSET: ${{ inputs.download-asset }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
        SEVENZIP_BINARY: ${{ steps.sevenzip.outputs.sevenzip_binary || steps.sevenzip-env.outputs.sevenzip_binary }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_TEMP: ${{ runner.temp }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Cache prebuilt binary
      if: >-
        inputs.binary-source == 'prebuilt' &&
        inputs.cache-prebuilt == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/rust-llm-tidy-bin
        key: >-
          ${{ inputs.release-repo }}-${{ inputs.release-tag }}-
          ${{ steps.prebuilt.outputs.asset_name }}

    # ── Build from source (git mode) ─────────────────────────
    - name: Install Rust toolchain
      if: >-
        inputs.binary-source == 'git' &&
        inputs.install-rust-toolchain == 'true'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        cache: false

    - name: Setup Rust cache for git build
      if: >-
        inputs.binary-source == 'git' &&
        inputs.setup-rust-cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        cache-all-crates: true
        # The rust-llm-tidy source checkout keeps its workspace manifest either
        # at the repo root (>= 1.4) or under src/ (older); point rust-cache at
        # the resolved manifest so its `cargo metadata` probe resolves instead
        # of failing against the wrong directory.
        workspaces: "${{ steps.source.outputs.manifest }} -> target"
        # Builds go to $RUNNER_TEMP/rlt-target (never the workspace), so the
        # workspace target stays empty; cache the real build dir explicitly so
        # later runs rebuild from a warm target instead of compiling the
        # workspace from scratch.
        cache-directories: "${{ runner.temp }}/rlt-target"

    - name: Build rust-llm-tidy from source
      if: inputs.binary-source == 'git'
      id: build
      shell: bash
      env:
        RLT_SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        RLT_MANIFEST: ${{ steps.source.outputs.manifest }}
        RLT_TARGET_DIR: ${{ runner.temp }}/rlt-target
        RLT_USE_SOURCE_CHECKOUT: ${{ inputs.use-source-checkout }}
        RLT_SOURCE_CHECKOUT_DIR: ${{ github.workspace }}/.rlt-source
      run: |
        set -euo pipefail
        if [ -z "$RLT_MANIFEST" ]; then
          echo "::error::source-path $RLT_SOURCE_DIR has no root or src/ Cargo.toml; point source-path at a rust-llm-tidy checkout or set use-source-checkout: true" >&2
          exit 1
        fi
        # Build into a temp target dir so no artifacts (binaries) are left
        # inside the source checkout / current repository.
        cargo build --release \
          --manifest-path "$RLT_MANIFEST" \
          --target-dir "$RLT_TARGET_DIR" \
          -p rust-llm-tidy-cli --bin rust-llm-tidy
        BIN="$RLT_TARGET_DIR/release/rust-llm-tidy"
        if [ ! -x "$BIN" ] && [ -x "$BIN.exe" ]; then
          BIN="$BIN.exe"
        fi
        echo "binary_path=$BIN" >> "$GITHUB_OUTPUT"

        # If the action itself checked out the source (use-source-checkout),
        # remove that checkout so nothing extra is left in the workspace.
        if [ "$RLT_USE_SOURCE_CHECKOUT" = "true" ] && \
           [ "$RLT_SOURCE_DIR" = "$RLT_SOURCE_CHECKOUT_DIR" ]; then
          rm -rf -- "$RLT_SOURCE_CHECKOUT_DIR"
        fi

    # ── Final binary path ────────────────────────────────────
    - name: Resolve final binary path
      id: binary
      shell: bash
      env:
        RLT_PREBUILT_PATH: ${{ steps.prebuilt.outputs.binary_path }}
        RLT_BUILD_PATH: ${{ steps.build.outputs.binary_path }}
      run: |
        if [ "${{ inputs.binary-source }}" = "prebuilt" ]; then
          printf 'path=%s\n' "$RLT_PREBUILT_PATH" >> "$GITHUB_OUTPUT"
        elif [ "${{ inputs.binary-source }}" = "git" ]; then
          printf 'path=%s\n' "$RLT_BUILD_PATH" >> "$GITHUB_OUTPUT"
        else
          printf 'path=rust-llm-tidy\n' >> "$GITHUB_OUTPUT"
        fi

    # ── Run ──────────────────────────────────────────
    # Builds the tidy argv from the inputs, runs it, and drives the PR
    # workflow. Check reports without editing. Apply pushes PR fixes or
    # leaves non-PR edits.
    - name: Run rust-llm-tidy
      id: tidy
      shell: bash
      working-directory: ${{ inputs.rust-project-path }}
      env:
        RLT_BIN: ${{ steps.binary.outputs.path }}
        # ── Tidy invocation inputs ───────────────────────
        RLT_MODE: ${{ inputs.mode }}
        RLT_VALIDATE: ${{ inputs.validate }}
        RLT_NO_CONFIG: ${{ inputs.no-config }}
        RLT_DRY_RUN: ${{ inputs.dry-run }}
        RLT_CONFIG_PATH: ${{ inputs.config-path }}
        RLT_INCLUDE: ${{ inputs.include }}
        RLT_EXCLUDE: ${{ inputs.exclude }}
        RLT_PATH_LIST: ${{ inputs.paths }}
        RLT_DEFAULT_FILES: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        RLT_CHANGED_FILES: ${{ inputs.changed-files }}
        # ── PR context ───────────────────────────────────
        IS_PR: ${{ github.event_name == 'pull_request' }}
        RLT_PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ github.head_ref }}
        COMMIT_NAME: github-actions[bot]
        COMMIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        # PR head SHA (github.sha is the merge commit on PR events); comment
        # links pin to the exact commit the run linted, immune to later pushes.
        RLT_BLOB_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha || github.sha }}/
        # Failed pushes recollect this committed revision.
        RLT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 "${{ github.action_path }}/scripts/run_tidy.py"
